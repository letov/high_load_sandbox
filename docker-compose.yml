services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: high_load_sandbox
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      HTTP_ADDR: ":9080"
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/high_load_sandbox?sslmode=disable"
      JWT_SECRET: "dev-secret-change-me"
    ports:
      - "9080:9080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
